services:
  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      # Override host port via $VECTOR_PG_HOST_PORT (e.g. when another Postgres
      # already binds 5432 locally). Defaults to 5432 — what CI uses.
      - "${VECTOR_PG_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
